<!DOCTYPE html>
<html>

<head>

    <title>SpendTrack - Add Expense</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="page-header">

        <h1>➕ Add Expense</h1>

        <a href="/dashboard">
            ← Dashboard
        </a>

    </div>


    <div class="form-box">

        <form action="/add-expense" method="POST">

            <label>Expense Name</label>

            <input
                type="text"
                name="title"
                placeholder="Example: Lunch"
                required
            >


            <label>Amount (₹)</label>

            <input
                type="number"
                name="amount"
                placeholder="Example: 250"
                step="0.01"
                min="0"
                required
            >


            <label>Category</label>

            <select name="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Food">
                    🍔 Food
                </option>

                <option value="Travel">
                    🚗 Travel
                </option>

                <option value="Shopping">
                    🛍️ Shopping
                </option>

                <option value="Bills">
                    💡 Bills
                </option>

                <option value="Education">
                    📚 Education
                </option>

                <option value="Entertainment">
                    🎬 Entertainment
                </option>

                <option value="Health">
                    🏥 Health
                </option>

                <option value="Other">
                    📦 Other
                </option>

            </select>


            <label>Date</label>

            <input
                type="date"
                name="date"
                required
            >


            <button type="submit">
                💾 Save Expense
            </button>

        </form>

    </div>

</div>

</body>

</html>
