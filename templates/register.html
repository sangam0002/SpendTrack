<!DOCTYPE html>
<html>

<head>

    <title>SpendTrack - Create Account</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>💰 SpendTrack</h1>

        <p class="subtitle">
            Start tracking your expenses
        </p>

        <h2>Create Account</h2>

        <form action="/register" method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="account-text">
            Already have an account?
            <a href="/">Login</a>
        </p>

    </div>

</div>

</body>

</html>
